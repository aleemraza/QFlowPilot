[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qflowpilot"
version = "0.1.0"
description = "QFlowPilot"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["qflowpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]