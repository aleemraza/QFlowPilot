
# QFlowPilot: Ideal simulation configuration

shots:
  initial_shots: 1024
  min_shots: 100
  max_shots: 100000
  additional_shots: 1024

quality:
  confidence_level: 0.95
  min_success_probability: 0.80
  min_application_score: 0.90
  max_standard_error: 0.05

backend:
  execution_mode: ideal_simulator
  backend_name: aer_simulator
  optimization_level: 1
  transpilation_enabled: true

runtime:
  execution_timeout_s: 300
  max_retries: 2
  retry_delay_s: 1.0
  random_seed: 42
  fail_fast: true
  collect_metrics: true
